# docs/ 가 push 되면 GitHub Pages 로 배포한다 — 배포 전용.
#
# ⚠️ 수집을 Actions 에서 돌리지 않는 이유(2026-08-28 실측):
#   공공데이터포털 API 가 GitHub 러너(해외 IP)에서 사실상 차단된다.
#   프로브 115개 전부 0건, 호출당 ~2분 지연으로 4시간 만에 실패했다.
#   수집·계산은 로컬 스케줄러(매월 1일)가 하고, 여기는 docs 만 배포한다.
#   덕분에 API 키가 GitHub 에 있을 필요도 없다.
name: deploy-pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
